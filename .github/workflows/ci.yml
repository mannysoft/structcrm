name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Pest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Run test suite
        env:
          DB_CONNECTION: sqlite
        run: php artisan test --compact

  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  browser-tests:
    name: Browser tests (Dusk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          APP_KEY=$(grep '^APP_KEY=' .env | cut -d= -f2-)
          cat > .env.dusk.local <<EOF
          APP_NAME=StructCRM
          APP_ENV=local
          APP_KEY=${APP_KEY}
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8000

          LOG_CHANNEL=stack
          LOG_LEVEL=debug

          DB_CONNECTION=sqlite
          DB_DATABASE=database/dusk.sqlite

          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync

          CACHE_STORE=array

          MAIL_MAILER=array
          EOF

      - name: Prepare Dusk database
        run: |
          touch database/dusk.sqlite
          DB_CONNECTION=sqlite DB_DATABASE=database/dusk.sqlite php artisan migrate:fresh --force --no-interaction
          DB_CONNECTION=sqlite DB_DATABASE=database/dusk.sqlite php artisan db:seed --class=RolePermissionSeeder --force --no-interaction

      - name: Start app server
        run: |
          APP_URL=http://127.0.0.1:8000 DB_CONNECTION=sqlite DB_DATABASE=database/dusk.sqlite php artisan serve --host=127.0.0.1 --port=8000 --no-reload > storage/logs/dusk-server.log 2>&1 &
          echo $! > dusk-server.pid

      - name: Run Dusk tests
        run: php artisan dusk

      - name: Stop app server
        if: always()
        run: |
          if [ -f dusk-server.pid ]; then kill "$(cat dusk-server.pid)" 2>/dev/null || true; fi
